services:
  glinux:
    build: .
    container_name: glinux
    restart: unless-stopped
    ports:
      - "${DUMBTERM_PORT:-3000}:3000"
    volumes:
      - ${DUMBTERM_CONFIG:-./config}:/root/.config
      - ${DUMBTERM_DATA_DIR:-./data}:/root/data
    environment:
      TZ: ${DUMBTERM_TZ:-Asia/Kolkata}
      SITE_TITLE: ${DUMBTERM_SITE_TITLE:-GLinux}
      DUMBTERM_PIN: ${DUMBTERM_PIN:?Set a private DUMBTERM_PIN in .env before starting}
      BASE_URL: ${DUMBTERM_BASE_URL:-http://localhost:3000}
      ENABLE_STARSHIP: ${ENABLE_STARSHIP:-true}
      LOCKOUT_TIME: ${DUMBTERM_LOCKOUT_TIME:-15}
      MAX_SESSION_AGE: ${DUMBTERM_MAX_SESSION_AGE:-24}
      # Before public deployment, set ALLOWED_ORIGINS to your exact trusted GLab origin.
      # ALLOWED_ORIGINS: ${DUMBTERM_ALLOWED_ORIGINS}
